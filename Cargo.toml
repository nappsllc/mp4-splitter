[package]
name = "mp4-splitter"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Tiny, good-looking, cross-platform tool that splits MP4 videos losslessly"
repository = "https://github.com/nappsllc/mp4-splitter"
rust-version = "1.88"

[[bin]]
name = "mp4-splitter"
path = "src/main.rs"

[dependencies]
anyhow = "1"

# Windows is hand-rolled on the OS's own APIs (as Rustshot is); macOS and Linux
# stay on these until they are ported.
[target.'cfg(not(windows))'.dependencies]
winit = "0.30"
softbuffer = "0.4"
cpal = "0.15"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Storage_Packaging_Appx",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
] }
windows-core = "0.62"

# The UI font is baked at build time (build.rs): no font parser at run time.
[build-dependencies]
ab_glyph = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
