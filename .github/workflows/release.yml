name: release

# A pushed tag v1.2.3 builds the three systems and publishes a GitHub release
# with the binaries and their checksums. Run by hand, it builds and stops there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: windows-x86_64 }
          - { name: macOS, os: macos-latest, target: macos-arm64 }
          - { name: Linux, os: ubuntu-latest, target: linux-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: The version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tag must say what Cargo.toml says, or the About page would disagree.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Check the exe's icon and version info (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vi = (Get-Item target\release\mp4-splitter.exe).VersionInfo
          "ProductName='$($vi.ProductName)' CompanyName='$($vi.CompanyName)' ProductVersion='$($vi.ProductVersion)'"
          if ($vi.ProductName -ne 'PowerNapps MP4 Splitter' -or $vi.ProductVersion -ne '${{ steps.version.outputs.version }}') { throw 'no version info: was rc.exe found?' }

      - name: Package
        shell: bash
        run: |
          name="mp4-splitter-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir dist
          case "${{ runner.os }}" in
            Windows)
              cp target/release/mp4-splitter.exe "dist/$name.exe"
              ;;
            macOS)
              mkdir "$name"
              cp target/release/mp4-splitter LICENSE NOTICE README.md "$name/"
              ditto -c -k --keepParent "$name" "dist/$name.zip"
              ;;
            Linux)
              mkdir "$name"
              cp target/release/mp4-splitter LICENSE NOTICE README.md "$name/"
              tar -czf "dist/$name.tar.gz" "$name"
              ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The Store's package, from the exe built above. Unsigned: the Store signs it.
  # Without the Partner Center identity (docs/STORES.md) it is built with placeholders,
  # named ...-PLACEHOLDER.msix, and stays off the release.
  msix:
    name: Store package
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: exe

      - name: Package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
        run: |
          $env:MSIX_EXE = (Get-ChildItem exe\*.exe | Select-Object -First 1).FullName
          packaging\windows\msix.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/*.msix
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [build, msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          # A package with placeholder values is no use to anyone downloading it.
          rm -f -- *PLACEHOLDER*
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" 'index($0, v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "PowerNapps MP4 Splitter $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
